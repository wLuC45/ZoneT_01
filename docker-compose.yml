# docker-compose.yml — alternativa ao run.sh (Docker ou podman-compose).
# Sobe: docker compose up -d --build
services:
  zonet01:
    build:
      context: .
      dockerfile: Containerfile
    image: zonet01:latest
    container_name: zonet01
    ports:
      - "127.0.0.1:5000:5000"
    # Resolver exclusivo = dnscrypt-proxy interno; impede vazamento de DNS.
    dns:
      - 127.0.0.1
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: "no"
    # Não grava a saída dos daemons no disco do host (rastro forense).
    logging:
      driver: "none"
    # Para esconder o uso do Tor da rede, descomente e aponte para um arquivo
    # de bridges obfs4 (ver infra/tor/bridges.exemplo.conf):
    # volumes:
    #   - ./bridges.conf:/etc/tor/bridges.conf:ro
    tmpfs:
      - /var/lib/tor:rw,mode=0700,size=32m
      - /var/cache/dnscrypt-proxy:rw,mode=0755,size=16m
      - /var/log/zonet:rw,mode=0755,size=32m
      - /run:rw,mode=0755,size=16m
      - /tmp:rw,mode=1777,size=32m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/readyz"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 120s
