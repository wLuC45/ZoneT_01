name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    name: Lint de scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Rodar shellcheck
        run: shellcheck run.sh infra/entrypoint.sh scripts/*.sh
