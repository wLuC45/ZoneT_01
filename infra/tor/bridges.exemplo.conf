# Modelo de arquivo de bridges do ZoneT_01.
#
# As bridges escondem o uso do Tor de quem observa a rede do operador. Sem
# elas, um observador local vê conexões para guardas Tor conhecidos.
#
# Dois tipos:
#
#   Vanilla  -- funcionam sem nada extra. Evitam o uso de guardas públicos
#               conhecidos, mas não disfarçam que o tráfego é Tor.
#               Formato:  IP:PORTA FINGERPRINT
#
#   obfs4    -- disfarçam o tráfego como dados genéricos, escondendo até o
#               fato de ser Tor. Exigem um binário obfs4proxy ou lyrebird
#               presente no contêiner; como o Alpine não o empacota, monte
#               um binário estático, por exemplo:
#                 -v /caminho/obfs4proxy:/usr/local/bin/obfs4proxy:ro
#               (o entrypoint detecta obfs4proxy e lyrebird no PATH).
#               Formato:  obfs4 IP:PORTA FINGERPRINT cert=... iat-mode=0
#
# Como usar:
#   1. Obtenha bridges em https://bridges.torproject.org (ou por e-mail para
#      bridges@torproject.org).
#   2. Coloque uma bridge por linha (cole o formato tal como vem do site; o
#      prefixo "Bridge" é adicionado automaticamente).
#   3. Monte o arquivo no contêiner em /etc/tor/bridges.conf:
#        export ZONET_BRIDGES=/caminho/bridges.conf && ./run.sh
#      ou diretamente:
#        podman run ... -v /caminho/bridges.conf:/etc/tor/bridges.conf:ro ...
#
# Linhas em branco e iniciadas por # são ignoradas.
#
# Exemplos (NÃO funcionais, substitua por bridges reais):
# 192.0.2.10:443 0123456789ABCDEF0123456789ABCDEF01234567
# obfs4 192.0.2.20:9443 FEDCBA9876543210FEDCBA9876543210FEDCBA98 cert=EXEMPLO iat-mode=0
